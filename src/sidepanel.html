<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Collection Manager</title>

    <!-- No remote assets: Font Awesome and Inter are self-hosted and bundled by Vite (Phase 5.4).
       See the vendor imports in src/main.jsx. -->

    <!-- No source stylesheet link: `src/main.jsx` imports `src/styles/index.css`, so Vite emits one
       hashed asset and injects the <link> into the built page. The cascade order lives in that one
       entry file (tokens → panel → shell) rather than being split between here and the JS. -->
  </head>
  <body>
    <!-- The whole panel is React-rendered; `.container` keeps the legacy stylesheet's layout box and
       `#root` is the mount point. `.creator` and every other element are rendered by the app. -->
    <div class="ut-container" id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
