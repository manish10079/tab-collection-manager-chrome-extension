<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Collection Manager</title>

    <!-- No remote assets: Font Awesome and Inter are self-hosted and bundled by Vite (Phase 5.4).
       See the vendor imports in src/main.jsx. -->

    <!-- The panel stylesheet. Vite bundles it into a hashed asset alongside the React bundle;
       `src/styles/shell.css` is imported by `src/main.jsx` and layers React-owned rules on top. -->
    <link rel="stylesheet" href="./styles/panel.css" />
  </head>
  <body>
    <!-- The whole panel is React-rendered; `.container` keeps the legacy stylesheet's layout box and
       `#root` is the mount point. `.creator` and every other element are rendered by the app. -->
    <div class="container" id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
