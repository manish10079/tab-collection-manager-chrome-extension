<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Collection Manager</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <span class="creator">By Mkn Labs</span>
    <header class="header">
      <h1><i class="fas fa-layer-group"></i> <span id="app-name"></span><sub id="version" style="font-size: 0.5rem; font-weight: 100;"></sub></h1>
      <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <i class="fas fa-cog"></i>
        </button>
        <button id="closePanelBtn" class="icon-btn" title="Close Panel">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <p class="subtitle">Autosave & organize your browsing sessions</p>
    </header>

    <div class="scrollable-content">
      <div class="controls">        <div class="compact-controls-row">
          <!-- Default Actions Bar -->
          <div class="actions-bar-default" id="actionsBarDefault">
            <button class="icon-btn" id="toggleSearchBtn" title="Search Collections or Tabs (Ctrl+F)">
              <i class="fas fa-search"></i>
            </button>
            <button class="icon-btn" id="toggleCreateBtn" title="Create New Collection (Ctrl+N)">
              <i class="fas fa-plus"></i>
            </button>
            <button class="icon-btn" id="globalImportBtn" title="Import All Collections (JSON)">
              <i class="fas fa-file-import"></i>
            </button>
            <button class="icon-btn" id="globalExportBtn" title="Export All Collections (JSON)">
              <i class="fas fa-file-export"></i>
            </button>
            <button class="icon-btn" id="toggleLayoutBtn" title="Switch to Grid View">
              <i class="fas fa-th-large"></i>
            </button>
            <!-- Restore button — visible only when a backup exists -->
            <button id="restoreBackupBtn" class="icon-btn btn-restore hidden" title="Restore Previous Session">
              <i class="fas fa-undo"></i>
            </button>
            <!-- Sort collections dropdown -->
            <button class="icon-btn sort-collections-btn" title="Sort Collections">
                <i id="collectionSortIcon"
                  class="fas fa-arrow-up-wide-short"></i>
              <div class="sort-dropdown-menu hidden" id="collectionsSortMenu">
                <div class="sort-option active" data-value="custom"><i class="fas fa-grip-vertical"></i> Custom Order</div>
                <div class="sort-option" data-value="lastModified"><i class="fas fa-clock"></i> Last Modified</div>
                <div class="sort-option" data-value="nameAsc"><i class="fas fa-sort-alpha-down"></i> Name (A-Z)</div>
                <div class="sort-option" data-value="nameDesc"><i class="fa-solid fa-arrow-down-z-a"></i> Name (Z-A)</div>
                <div class="sort-option" data-value="dateCreated"><i class="fas fa-calendar-plus"></i>  Date Created (Newest)</div>
                <div class="sort-option" data-value="dateCreatedAsc"><i class="fas fa-calendar-plus"></i> Date Created (Oldest)</div>
                <div class="sort-option" data-value="tabCount"><i class="fa-solid fa-arrow-down-9-1"></i> Tab Count (Highest)</div>
                <div class="sort-option" data-value="tabCountAsc"><i class="fa-solid fa-arrow-down-1-9"></i> Tab Count (Lowest)</div>
              </div>
            </button>
          <!-- session history -->
          <button class="icon-btn" id="historyBtn" title="Session History">
            <i class="fas fa-history"></i>
          </button>
          </div>

          <!-- Dynamic Search Input -->
          <div class="input-slide-container hidden" id="searchSlideContainer">
            <div class="input-wrapper search-wrapper">
              <input type="text" id="searchBox" placeholder="Search collections or tabs…" autocomplete="off" spellcheck="false" />
              <button class="icon-btn input-action-btn" id="clearSearchBtn" title="Clear &amp; Close">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>

          <!-- Dynamic Create Collection Input -->
          <div class="input-slide-container hidden" id="createSlideContainer">
            <div class="input-wrapper create-wrapper">
              <input type="text" id="newCollectionName" placeholder="New collection name" maxlength="50" autocomplete="off" spellcheck="false" />
              <button class="icon-btn input-action-btn success-btn" id="createCollection" title="Create">
                <i class="fas fa-check"></i>
              </button>
              <button class="icon-btn input-action-btn cancel-btn" id="cancelCreateBtn" title="Cancel">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Rendered by React (src/features/collections) straight from chrome.storage.local.
           The container keeps its legacy id and classes so popup.css and the remaining
           legacy lookups stay valid. -->
      <div class="collections-container" id="collectionsContainer"></div>

      <!-- Global search results (shown instead of collectionsContainer when a query is active) -->
      <div id="searchResultsContainer" class="search-results-container"></div>
    </div>

    <!-- Toasts and every dialog (settings, add tabs, history, session details, duplicates,
         shortcuts help) are React-owned and portal into #tcm-modal-root on document.body
         (src/components/Modal.jsx, src/app/providers/ToastProvider.jsx). -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
